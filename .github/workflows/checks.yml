name: jec-chat checks
on:
  push:
  pull_request:
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Codex reader syntax
        run: node --check mods/jec-chat/providers/codex.cjs
      - name: Run reader tests
        run: node --test tests/codex.test.cjs
