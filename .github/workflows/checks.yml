name: JEC checks (manual)
on:
  workflow_dispatch:
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Codex reader syntax
        run: |
          node --check mods/jec-chat/providers/codex.cjs
          node --check mods/jec-chat/providers/session-hook.cjs
          node --check mods/jec-chat/providers/install-hooks.cjs
      - name: Check Herdr mod JavaScript syntax
        run: |
          node --check mods/jec-machines/main.js
          node --check mods/jec-machines/model.js
          node --check scripts/disable-chat-hooks.cjs
          node --check mods/jec-chat/main.js
          node --check mods/jec-chat/pane-header.js
          node --check mods/jec-chat/session.js
          node --check mods/jec-chat/view-state.js
          node --check mods/jec-chat/provider-catalog.js
          node --check mods/jec-chat/providers/index.js
          node --check mods/jec-chat/providers/opencode.js
          node --check integrations/opencode/tui.ts
          node --check mods/jec-chat/providers/pi.js
          node --check integrations/pi/jec-chat.ts
          node --check mods/jec-chat/providers/codex.js
          node --check mods/jec-chat/providers/match.js
      - name: Validate layout and mod metadata
        run: node -e "const f=require('fs');for(const p of ['layouts/jec-chat.json','mods/jec-chat/mod.json','mods/jec-machines/mod.json']) JSON.parse(f.readFileSync(p,'utf8'))"
      - name: Run all JEC tests
        run: node --test
